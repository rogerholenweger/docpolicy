[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docpolicy"
version = "0.1.0"
description = "Portable documentation-drift enforcement — one policy file per repo, one stdlib-only checker, several enforcement surfaces."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Roger Holenweger" }]
keywords = ["documentation", "docs", "lint", "policy", "frontmatter", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rogerholenweger/docpolicy"

[project.scripts]
docpolicy = "docpolicy.cli:main"

[tool.setuptools]
packages = ["docpolicy"]
